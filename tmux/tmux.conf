# Leave the clipboard to the terminal: pass apps' copy requests (OSC 52)
# straight through instead of intercepting paste keys
set -g set-clipboard on

# Number windows and panes from 1
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Status bar (matches the starship prompt: cobalt block, slanted separators, pills)
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=default,fg=white"

set -g status-left-length 30
set -g status-left "#[bg=#0047ab,fg=brightwhite,bold] 󰆍 #S #[nobold,fg=#0047ab,bg=default] "

set -g status-right-length 90
if-shell '[ "$(uname)" = Darwin ]' 'set -g @os_icon 󰀵' 'set -g @os_icon 󰕈'
set -g status-right "#[bg=default]#(~/.config/tmux/claude-usage.sh)#[fg=green]#[bg=green,fg=black]#{@os_icon} #[bg=brightblack,fg=brightwhite] #h #[default]"

set -g window-status-format "#[fg=white] #I:#W "
set -g window-status-current-format "#[fg=brightblack,bg=default]#[bg=brightblack,fg=brightwhite,bold] #I:#W #[nobold,fg=brightblack,bg=default]"
set -g window-status-separator ""

# Blank line above the status bar: two-line status, line 0 empty, bar moved to line 1
set -g status 2
set -gu status-format
set -Fg 'status-format[1]' '#{status-format[0]}'
set -g 'status-format[0]' ''

set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "fg=#0047ab"
set -g message-style "bg=brightblack,fg=brightwhite"

# Border label: cobalt on the active pane, dim on the rest
set -g pane-border-status top
set -g pane-border-format "#{?pane_active,#[bg=#0047ab fg=brightwhite bold] #P #{?@pane_name,#{@pane_name},#{pane_current_command}} ,#[fg=brightblack] #P #{?@pane_name,#{@pane_name},#{pane_current_command}} }"

# rename pane: prefix + . (empty name resets to running command)
bind . command-prompt -p "pane name:" -I "#{@pane_name}" "set-option -p @pane_name '%%'"

# Let apps pass escape sequences (e.g. OSC 9;4 progress bar) through to the terminal
set -g allow-passthrough on

# Point clipboard tools (xclip) at the machine's desktop X session so Claude Code's
# Ctrl+V can read screenshots that mac-clipboard-sync.sh pushes in over ssh.
# New panes inherit this; restart claude in older panes. Display may change on reboot.
# Don't let attaching over ssh (no DISPLAY) wipe these from the session env
set -g update-environment "KRB5CCNAME SSH_ASKPASS SSH_AUTH_SOCK SSH_AGENT_PID SSH_CONNECTION WINDOWID"
set-environment -g DISPLAY :1
set-environment -g XAUTHORITY /run/user/1002/gdm/Xauthority

# Arrow pane-switching: no repeat (default binds use -r, so a 2nd arrow within repeat-time switches again)
bind Up    select-pane -U
bind Down  select-pane -D
bind Left  select-pane -L
bind Right select-pane -R

# Vim-style pane-switching (l replaces the default last-window)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
