# Powder — Yazi port of the Ghostty theme (ghostty/themes/Powder). Status bar
# matches the starship prompt and tmux bar: cobalt mode block, slanted
# separators, lime active tab. Colours follow helix/themes/powder.toml.

[mgr]
cwd           = { fg = "#5eead4" }
find_keyword  = { fg = "#fbbf24", bold = true, underline = true }
find_position = { fg = "#a78bfa", bold = true, italic = true }
border_style  = { fg = "#3a3e4a" }

marker_copied   = { fg = "#a3e635", bg = "#a3e635" }
marker_cut      = { fg = "#fb7185", bg = "#fb7185" }
marker_marked   = { fg = "#5eead4", bg = "#5eead4" }
marker_selected = { fg = "#fbbf24", bg = "#fbbf24" }

count_copied   = { fg = "#0c1010", bg = "#a3e635" }
count_cut      = { fg = "#0c1010", bg = "#fb7185" }
count_selected = { fg = "#0c1010", bg = "#fbbf24" }

[indicator]
parent  = { fg = "#dde1ea", bg = "#24262e" }
current = { fg = "#dde1ea", bg = "#1a302d", bold = true }
preview = { underline = true }

[tabs]
active    = { fg = "#0c1010", bg = "#a3e635", bold = true }
inactive  = { fg = "#b6bac8", bg = "#1a1b21" }
sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

[mode]
normal_main = { fg = "#dde1ea", bg = "#0047ab", bold = true }
normal_alt  = { fg = "#dde1ea", bg = "#5d6070" }
select_main = { fg = "#0c1010", bg = "#a78bfa", bold = true }
select_alt  = { fg = "#dde1ea", bg = "#5d6070" }
unset_main  = { fg = "#0c1010", bg = "#fb7185", bold = true }
unset_alt   = { fg = "#dde1ea", bg = "#5d6070" }

[status]
overall   = { fg = "#b6bac8" }
sep_left  = { open = "", close = "" }
sep_right = { open = "", close = "" }

perm_sep   = { fg = "#5d6070" }
perm_type  = { fg = "#6b97f2" }
perm_read  = { fg = "#fbbf24" }
perm_write = { fg = "#fb7185" }
perm_exec  = { fg = "#a3e635" }

progress_label  = { fg = "#dde1ea", bold = true }
progress_normal = { fg = "#a3e635", bg = "#1a1b21" }
progress_error  = { fg = "#fbbf24", bg = "#fb7185" }

[which]
border    = { fg = "#6b97f2" }
cand      = { fg = "#5eead4" }
rest      = { fg = "#5d6070" }
desc      = { fg = "#a78bfa" }
separator_style = { fg = "#5d6070" }

[confirm]
border  = { fg = "#6b97f2" }
title   = { fg = "#6b97f2", bold = true }
btn_yes = { fg = "#dde1ea", bg = "#0047ab", bold = true }

[spot]
border   = { fg = "#6b97f2" }
title    = { fg = "#6b97f2", bold = true }
tbl_col  = { fg = "#6b97f2" }
tbl_cell = { fg = "#dde1ea", bg = "#1a302d" }

[notify]
title_info  = { fg = "#a3e635" }
title_warn  = { fg = "#fbbf24" }
title_error = { fg = "#fb7185" }

[pick]
border = { fg = "#6b97f2" }
active = { fg = "#dde1ea", bg = "#1a302d", bold = true }

[input]
border   = { fg = "#6b97f2" }
hint     = { fg = "#5d6070", italic = true }
selected = { bg = "#1a302d" }

[cmp]
border = { fg = "#6b97f2" }
active = { fg = "#dde1ea", bg = "#1a302d", bold = true }

[tasks]
border  = { fg = "#6b97f2" }
hovered = { fg = "#dde1ea", bg = "#1a302d", bold = true }

[help]
border  = { fg = "#6b97f2" }
chord   = { fg = "#5eead4" }
hovered = { fg = "#dde1ea", bg = "#1a302d", bold = true }
