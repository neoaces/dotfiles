# Leave the clipboard to the terminal: pass apps' copy requests (OSC 52)
# straight through instead of intercepting paste keys
set -g set-clipboard on

# Number windows and panes from 1
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Status bar (miasma)
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=#1e1c19,fg=#c2c2b0"

set -g status-left-length 30
set -g status-left "#[bg=#b36d43,fg=#1e1c19,bold]  #S #[bg=#1e1c19,fg=#b36d43] "

set -g status-right-length 60
set -g status-right "#[fg=#666666]%a %d %b #[bg=#444444,fg=#c2c2b0] %H:%M #[bg=#5f875f,fg=#1e1c19,bold] #h "

set -g window-status-format "#[fg=#666666] #I:#W "
set -g window-status-current-format "#[bg=#444444,fg=#c9a554,bold] #I:#W "
set -g window-status-separator ""

set -g pane-border-style "fg=#444444"
set -g pane-active-border-style "fg=#b36d43"
set -g message-style "bg=#444444,fg=#c2c2b0"

# Border label: orange on the active pane, dim on the rest
set -g pane-border-status top
set -g pane-border-format "#{?pane_active,#[bg=#b36d43 fg=#1e1c19 bold] #P #{pane_current_command} ,#[fg=#666666] #P #{pane_current_command} }"
