# Leave the clipboard to the terminal: pass apps' copy requests (OSC 52)
# straight through instead of intercepting paste keys
set -g set-clipboard on

# Number windows and panes from 1
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Status bar (powder)
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=#0c1010,fg=#b6bac8"

set -g status-left-length 30
set -g status-left "#[bg=#6b97f2,fg=#0c1010,bold]  #S #[bg=#0c1010,fg=#6b97f2] "

set -g status-right-length 90
set -g status-right "#(~/.config/tmux/claude-usage.sh)#[fg=#5d6070]%a %d %b #[bg=#1a2221,fg=#b6bac8] %H:%M #[bg=#2dd4bf,fg=#0c1010,bold] #h "

set -g window-status-format "#[fg=#5d6070] #I:#W "
set -g window-status-current-format "#[bg=#1a2221,fg=#5eead4,bold] #I:#W "
set -g window-status-separator ""

set -g pane-border-style "fg=#1a2221"
set -g pane-active-border-style "fg=#6b97f2"
set -g message-style "bg=#1a2221,fg=#b6bac8"

# Border label: orange on the active pane, dim on the rest
set -g pane-border-status top
set -g pane-border-format "#{?pane_active,#[bg=#6b97f2 fg=#0c1010 bold] #P #{?@pane_name,#{@pane_name},#{pane_current_command}} ,#[fg=#5d6070] #P #{?@pane_name,#{@pane_name},#{pane_current_command}} }"

# rename pane: prefix + . (empty name resets to running command)
bind . command-prompt -p "pane name:" -I "#{@pane_name}" "set-option -p @pane_name '%%'"

# Let apps pass escape sequences (e.g. OSC 9;4 progress bar) through to the terminal
set -g allow-passthrough on

# Point clipboard tools (xclip) at the machine's desktop X session so Claude Code's
# Ctrl+V can read screenshots that mac-clipboard-sync.sh pushes in over ssh.
# New panes inherit this; restart claude in older panes. Display may change on reboot.
# Don't let attaching over ssh (no DISPLAY) wipe these from the session env
set -g update-environment "KRB5CCNAME SSH_ASKPASS SSH_AUTH_SOCK SSH_AGENT_PID SSH_CONNECTION WINDOWID"
set-environment -g DISPLAY :1
set-environment -g XAUTHORITY /run/user/1002/gdm/Xauthority

# Arrow pane-switching: no repeat (default binds use -r, so a 2nd arrow within repeat-time switches again)
bind Up    select-pane -U
bind Down  select-pane -D
bind Left  select-pane -L
bind Right select-pane -R
