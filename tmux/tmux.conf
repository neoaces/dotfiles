# Shift+Insert pastes the system clipboard
bind -n S-Insert run-shell "tmux set-buffer -- \"$(xclip -o -selection clipboard)\"; tmux paste-buffer -p"

# Status bar (miasma)
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=#222222,fg=#c2c2b0"

set -g status-left-length 30
set -g status-left "#[bg=#b36d43,fg=#222222,bold]  #S #[bg=#222222,fg=#b36d43] "

set -g status-right-length 60
set -g status-right "#[fg=#666666]%a %d %b #[bg=#444444,fg=#c2c2b0] %H:%M #[bg=#5f875f,fg=#222222,bold] #h "

set -g window-status-format "#[fg=#666666] #I:#W "
set -g window-status-current-format "#[bg=#444444,fg=#c9a554,bold] #I:#W "
set -g window-status-separator ""

set -g pane-border-style "fg=#444444"
set -g pane-active-border-style "fg=#b36d43"
set -g message-style "bg=#444444,fg=#c2c2b0"

# Border label: orange on the active pane, dim on the rest
set -g pane-border-status top
set -g pane-border-format "#{?pane_active,#[bg=#b36d43 fg=#222222 bold] #P #{pane_current_command} ,#[fg=#666666] #P #{pane_current_command} }"
